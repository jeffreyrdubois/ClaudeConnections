services:

  # ── Shared Cloudflare Tunnel ──────────────────────────────────────────────────
  # One cloudflared handles all MCP server hostnames.
  # Configure ingress rules in Cloudflare Zero Trust → Networks → Tunnels.
  #
  # Example ingress rules (set in the Cloudflare dashboard):
  #   ynabmcp.yourdomain.com   → http://localhost:3000
  #   mediamcp.yourdomain.com  → http://localhost:3001
  #
  # Get your tunnel token from:
  #   Cloudflare Zero Trust → Networks → Tunnels → your tunnel → Configure → Docker
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
