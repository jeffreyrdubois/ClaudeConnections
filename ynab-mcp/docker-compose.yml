services:
  ynab-mcp:
    build: .
    container_name: ynab-mcp
    ports:
      - "3000:3000"
    environment:
      - YNAB_API_TOKEN=${YNAB_API_TOKEN}
      - YNAB_BUDGET_ID=${YNAB_BUDGET_ID:-last-used}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
