## subdomain reverse proxy config for ynab-mcp
## Place this file at:
##   /mnt/user/appdata/swag/nginx/proxy-confs/ynab-mcp.subdomain.conf
##
## Then restart SWAG (or reload nginx: docker exec swag nginx -s reload)

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name mcp.*;

    include /config/nginx/ssl.conf;

    # Only allow Cloudflare IPs (strongly recommended when using CF proxy)
    # Uncomment the include below after downloading the Cloudflare IP list.
    # SWAG ships this file; it's updated automatically.
    include /config/nginx/cf.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app   ynab-mcp;
        set $upstream_port  3000;
        set $upstream_proto http;

        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Pass real visitor IP from Cloudflare header
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    }
}
