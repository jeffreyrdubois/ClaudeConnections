services:

  # ── YNAB MCP Server ──────────────────────────────────────────────────────────
  # Tunnel is handled by the shared cloudflared container (see cloudflared/).
  mcp-ynab:
    build: .
    container_name: mcp-ynab
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - YNAB_API_TOKEN=${YNAB_API_TOKEN}
      - YNAB_BUDGET_ID=${YNAB_BUDGET_ID:-last-used}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - PORT=3000
    volumes:
      - ./config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
